<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Drive Studio — Google Drive</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  :root { --bg: #f6f8fb; --text: #1b2430; --muted: #566273; --accent: #0b6bcb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161d; --text: #e6ebf1; --muted: #a2adbb; --accent: #5aa7f0; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; padding: 24px 16px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 1.25rem; margin: 12px 0 4px; }
  p { margin: 0 0 8px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="assets/logo.svg" alt="">
  <h1 id="title">Drive Studio</h1>
  <p id="message">Loading Google Drive…</p>
</main>
<script src="picker.js"></script>
</body>
</html>
